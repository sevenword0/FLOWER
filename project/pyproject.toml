[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "biogen"
version = "0.1.0"
description = "Taxon-agnostic procedural biology pipeline (one-word-swap retargetable): presets, procedural mesh/rig/material, autonomous behavior + ecosystem simulation."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "PyYAML>=6.0", "jsonschema>=4.0"]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
biogen = "biogen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
